apply plugin: 'com.android.application'

android {
    namespace "com.iptv.player.zero.legacy"
    compileSdk 36
    defaultConfig {
        applicationId "com.iptv.player.zero.legacy"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 204
        versionName "8.7.0-legacy.5"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
}
