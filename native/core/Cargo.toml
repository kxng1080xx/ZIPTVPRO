[package]
name = "ziptv_core"
version = "10.0.0"
edition = "2021"
publish = false

[lib]
# cdylib: loaded by Kotlin (JNA) on Android and desktop; lib: for tests.
crate-type = ["cdylib", "lib"]
name = "ziptv_core"

[[bin]]
# Generates the Kotlin bindings from the built library (uniffi "library mode").
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
thiserror = "2"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
