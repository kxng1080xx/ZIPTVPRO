name: v10 Release (optimized APK + EXE, published)

# Manual trigger. Builds the Rust core with full release optimization (LTO, 1 codegen unit)
# for all 4 Android ABIs and Windows on GitHub's runners, packages the APK and the Windows .exe installer, and
# publishes release v<ziptv.version> (from native/app/gradle.properties).
# Local builds use `FAST=1 native/core/build.sh` instead; this is the slow, optimized path.
#
# Secrets (optional but recommended):
#   ANDROID_DEBUG_KEYSTORE  base64 of ~/.android/debug.keystore, so CI APKs install over
#                           locally built ones (same signature)
#   TMDB_TOKEN              TMDB read token (artwork, cast, trailers)
on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }  # default "tools" no longer exists in sdkmanager
      - run: sdkmanager --install "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/core }
      - run: cargo install cargo-ndk --locked
      - name: Rust core (4 ABIs, optimized)
        working-directory: native/core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cargo test --release
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../app/androidApp/src/main/jniLibs build --release
      - name: Secrets -> keystore / TMDB token
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          [ -n "$KEYSTORE" ] || { echo "ANDROID_DEBUG_KEYSTORE secret missing"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/v9.keystore"
          [ -n "$TMDB_TOKEN" ] && echo "TMDB_TOKEN=$TMDB_TOKEN" > .env || true
          # native/app/gradle.properties pins a Windows JDK path; the user-level file wins.
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
      - name: APK
        working-directory: native/app
        run: |
          chmod +x gradlew
          # Injected signing overrides the build's own config: ~/.android/debug.keystore was ignored on CI.
          ./gradlew :androidApp:assembleRelease --console=plain \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/v9.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          # app.apk: the name v9's updater and ziptvpro.pages.dev/app.apk redirect download.
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$GITHUB_WORKSPACE/app.apk"
          # Must be v9's key or it won't install over v9.
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs "$GITHUB_WORKSPACE/app.apk" \
            | grep -q f9e791a5105213af584377046665414fa8b35870eba8aff503c1bfb4b1cf3aa2 \
            || { echo "APK not signed with the v9 key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: 'app.apk', retention-days: 7 }

  windows:
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native/core }
      - name: Rust core (optimized DLL)
        working-directory: native/core
        run: |
          cargo build --release
          mkdir -p ../app/desktopApp/src/main/resources/win32-x86-64
          cp target/release/ziptv_core.dll ../app/desktopApp/src/main/resources/win32-x86-64/
      - name: TMDB token + JDK override
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          [ -n "$TMDB_TOKEN" ] && echo "TMDB_TOKEN=$TMDB_TOKEN" > .env || true
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$(cygpath -m "$JAVA_HOME")" >> ~/.gradle/gradle.properties
      - name: VLC to bundle (a trimmed copy goes into the installer)
        run: choco install vlc -y --no-progress
      - name: EXE installer
        working-directory: native/app
        env:
          VLC_DIR: C:/Program Files/VideoLAN/VLC
        run: |
          export JPACKAGE_JDK="$(cygpath -m "$JAVA_HOME")"  # Temurin 17 has jpackage
          ./gradlew.bat :desktopApp:packageExe --console=plain
          # The bundled JRE must carry jdk.unsupported (vlcj's frame buffers); without it video is black.
          rel=$(find desktopApp/build/compose -path '*runtime/release' | head -1)
          grep -q 'jdk.unsupported' "$rel" || { echo "::error::bundled runtime lacks jdk.unsupported ($rel): $(cat "$rel")"; exit 1; }
          v=$(grep '^ziptv.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          # latest.exe: the name ziptvpro.pages.dev/latest.exe redirects to (v9's PC update link).
          cp desktopApp/build/compose/binaries/main/exe/*.exe "$GITHUB_WORKSPACE/latest.exe"
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: 'latest.exe', retention-days: 7 }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish release v<version> as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep '^ziptv.version=' native/app/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          # Latest: pages.dev/app.apk + /latest.exe follow the latest release.
          gh release create "v$v" out/* --latest --target "$GITHUB_SHA" --title "ZIPTV Pro $v" --notes-file native/RELEASE_NOTES.md
      - name: Bump version.json (root package.json on main) so installed apps offer the update
        run: |
          v=$(grep '^ziptv.version=' native/app/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          git fetch -q origin main && git checkout -q -B main origin/main
          sed -i -E "0,/\"version\": *\"[^\"]+\"/s//\"version\": \"$v\"/" package.json
          git diff --quiet && { echo "already $v"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qam "chore: version $v"
          git push -q origin main
